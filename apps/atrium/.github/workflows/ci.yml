name: Atrium CI
on:
  push:
    branches: [integration, atrium-prod]
  pull_request:
    branches: [integration]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax check
        run: |
          find apps/atrium/backend -name "*.py" -not -path "*/__pycache__/*" -exec python3 -m py_compile {} \;
      - name: Install minimal Python deps + pytest
        run: |
          pip install -r backend/requirements-min.txt
          pip install pytest pytest-asyncio pyjwt typer httpx
      - name: pytest (Atrium Conductor entitlement tests)
        # Scoped to the 3 new test files from the entitlement-gating work.
        # The full backend/tests/ tree has pre-existing failures tracked
        # separately; widen this scope once those are resolved.
        # JWT_SECRET env var is intentionally omitted: both test files patch
        # the module-level secret via monkeypatch (jwt_auth.JWT_SECRET).
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -v \
            apps/atrium/backend/tests/test_jwt_auth.py \
            apps/atrium/backend/tests/test_require_app_access.py \
            apps/atrium/backend/tests/test_routers_gating.py
      - name: Svelte convention check
        run: |
          ! grep -rn "onclick=" src/lib/components/atrium/ --include="*.svelte" || exit 1
      - name: Install deps
        # --legacy-peer-deps required: @tiptap/extension-bubble-menu and
        # extension-floating-menu are intentionally pinned to v2 (see
        # src/lib/components/common/RichTextInput.svelte) while the rest of
        # the tiptap suite is on v3. Drop this flag once both extensions are
        # bumped to v3.
        run: npm ci --legacy-peer-deps
      - name: TypeScript check
        run: npx tsc --noEmit --skipLibCheck || true
